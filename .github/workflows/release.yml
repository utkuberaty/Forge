name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version without the v prefix
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
      GRADLE_JVM_ARGS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Verify tag and version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          tag="v$version"
          git rev-parse --verify "refs/tags/$tag"
          [[ "$version" != *-SNAPSHOT ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Validate formatting, tokens, and API
        run: |
          ./gradlew ktlintCheck :forge:verifyPrimitiveTokens :forge:checkKotlinAbi \
            -PVERSION_NAME=${{ steps.version.outputs.version }} --warning-mode fail --no-daemon \
            -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" --max-workers=2
      - name: Validate Android release gates
        run: |
          ./gradlew :forge:testAndroidHostTest :forge:lintAnalyzeAndroidHostTest \
            :forge:assembleAndroidMain \
            :forge-visual-tests:verifyRoborazziDebug :forge-kit-demo-android:assembleDebug \
            :forge-visual-tests:lintDebug :forge-kit-demo-android:lintDebug \
            -PVERSION_NAME=${{ steps.version.outputs.version }} --warning-mode fail --no-daemon \
            -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" --max-workers=2
      - name: Validate Apple release gates
        run: |
          ./gradlew :forge:compileKotlinIosArm64 :forge:iosSimulatorArm64Test \
            :forge-kit-demo:linkDebugFrameworkIosSimulatorArm64 \
            -PVERSION_NAME=${{ steps.version.outputs.version }} --warning-mode fail --no-daemon \
            -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" --max-workers=2
      - name: Validate AI guidance
        run: python scripts/check_ai_guidance.py
      - name: Package consumer smoke test
        run: |
          smoke_repo="$(mktemp -d)"
          ./gradlew :forge:publishAllPublicationsToSmokeRepository \
            -PforgeSmokeRepository="$smoke_repo" -PVERSION_NAME=${{ steps.version.outputs.version }} \
            --no-daemon -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" --max-workers=2
          FORGE_TEST_REPOSITORY="$smoke_repo" FORGE_TEST_VERSION=${{ steps.version.outputs.version }} \
            ./gradlew -p consumer-fixture :consumer:compileAndroidMain \
              :consumer:linkDebugFrameworkIosSimulatorArm64 --no-daemon \
              -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" --max-workers=2
      - name: Publish GitHub Packages
        run: |
          ./gradlew :forge:publishAllPublicationsToGitHubPackagesRepository \
            -PVERSION_NAME=${{ steps.version.outputs.version }} --no-daemon \
            -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" --max-workers=2
      - name: Sign, upload, and release Maven Central deployment
        if: ${{ env.ORG_GRADLE_PROJECT_mavenCentralUsername != '' && env.ORG_GRADLE_PROJECT_mavenCentralPassword != '' && env.ORG_GRADLE_PROJECT_signingInMemoryKey != '' }}
        run: |
          ./gradlew :forge:publishAndReleaseToMavenCentral \
            -PVERSION_NAME=${{ steps.version.outputs.version }} --no-daemon \
            -Dorg.gradle.jvmargs="$GRADLE_JVM_ARGS" --max-workers=2
      - name: Attach checksums and changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find forge/build/publications -type f -print0 | sort -z | xargs -0 shasum -a 256 > forge-${{ steps.version.outputs.version }}-checksums.txt
          cp CHANGELOG.md forge-${{ steps.version.outputs.version }}-changelog.md
          gh release upload "${{ steps.version.outputs.tag }}" forge-${{ steps.version.outputs.version }}-checksums.txt forge-${{ steps.version.outputs.version }}-changelog.md --clobber
