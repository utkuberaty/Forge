name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Verify tag and version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          [[ "$version" != *-SNAPSHOT ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate all release gates
        run: |
          ./gradlew ktlintCheck :forge:verifyPrimitiveTokens :forge:check :forge:checkKotlinAbi :forge:assemble \
            :forge-visual-tests:verifyRoborazziDebug :forge-kit-demo-android:assembleDebug \
            :forge-visual-tests:lintDebug :forge-kit-demo-android:lintDebug \
            :forge:compileKotlinIosArm64 :forge:iosSimulatorArm64Test \
            :forge-kit-demo:linkDebugFrameworkIosSimulatorArm64 \
            -PVERSION_NAME=${{ steps.version.outputs.version }} --warning-mode fail
          python scripts/check_ai_guidance.py
      - name: Package consumer smoke test
        run: |
          smoke_repo="$(mktemp -d)"
          ./gradlew :forge:publishAllPublicationsToSmokeRepository \
            -PforgeSmokeRepository="$smoke_repo" -PVERSION_NAME=${{ steps.version.outputs.version }}
          FORGE_TEST_REPOSITORY="$smoke_repo" FORGE_TEST_VERSION=${{ steps.version.outputs.version }} \
            ./gradlew -p consumer-fixture :consumer:compileAndroidMain :consumer:linkDebugFrameworkIosSimulatorArm64
      - name: Publish GitHub Packages
        run: ./gradlew :forge:publishAllPublicationsToGitHubPackagesRepository -PVERSION_NAME=${{ steps.version.outputs.version }}
      - name: Sign, upload, and release Maven Central deployment
        if: ${{ env.ORG_GRADLE_PROJECT_mavenCentralUsername != '' && env.ORG_GRADLE_PROJECT_mavenCentralPassword != '' && env.ORG_GRADLE_PROJECT_signingInMemoryKey != '' }}
        run: ./gradlew :forge:publishAndReleaseToMavenCentral -PVERSION_NAME=${{ steps.version.outputs.version }}
      - name: Attach checksums and changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find forge/build/publications -type f -print0 | sort -z | xargs -0 shasum -a 256 > forge-${{ steps.version.outputs.version }}-checksums.txt
          cp CHANGELOG.md forge-${{ steps.version.outputs.version }}-changelog.md
          gh release upload "$GITHUB_REF_NAME" forge-${{ steps.version.outputs.version }}-checksums.txt forge-${{ steps.version.outputs.version }}-changelog.md --clobber
