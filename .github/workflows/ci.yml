name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Formatting, token, and API checks
        run: ./gradlew ktlintCheck :forge:verifyPrimitiveTokens :forge:checkKotlinAbi --warning-mode fail --no-daemon
      - name: Android tests, lint, visual regression, and assembly
        run: |
          ./gradlew :forge:testAndroidHostTest :forge:lintAnalyzeAndroidHostTest \
            :forge:assembleAndroidMain :forge-visual-tests:verifyRoborazziDebug \
            :forge-visual-tests:lintDebug :forge-kit-demo-android:lintDebug \
            :forge-kit-demo-android:assembleDebug --warning-mode fail --no-daemon

  apple:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Compile, test, and link Apple targets
        run: |
          ./gradlew :forge:compileKotlinIosArm64 :forge:iosSimulatorArm64Test \
            :forge-kit-demo:linkDebugFrameworkIosSimulatorArm64 \
            --warning-mode fail --no-daemon

  publication-smoke:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Publish to isolated repository and consume only Maven coordinates
        run: |
          smoke_repo="$(mktemp -d)"
          ./gradlew :forge:publishAllPublicationsToSmokeRepository \
            -PforgeSmokeRepository="$smoke_repo" --no-daemon
          FORGE_TEST_REPOSITORY="$smoke_repo" FORGE_TEST_VERSION="0.1.0-SNAPSHOT" \
            ./gradlew -p consumer-fixture :consumer:compileAndroidMain \
              :consumer:linkDebugFrameworkIosSimulatorArm64 --no-daemon
          ! grep -R 'project(":forge")' consumer-fixture

  ai-guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_ai_guidance.py
